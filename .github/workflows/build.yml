name: Docker Build
on:
  pull_request:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  lookup-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - name: Get current versions
        id: versions
        run: |
          echo "versions=$(python -c 'import glob, json; print(json.dumps(glob.glob("1.*")))')" | tee $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs:
      - lookup-versions
    strategy:
      matrix:
        version: ${{ fromJson(needs.lookup-versions.outputs.versions) }}
        type: [apache, fpm, fpm-alpine]
    steps:
      - uses: actions/checkout@v4

      - name: Image-Name kleinschreiben
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login bei ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build und Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.version }}/${{ matrix.type }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}-${{ matrix.type }}
